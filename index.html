<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>KYUDO — Three.js MVP v4.2</title>
<style>
  :root{
    --ink:#ece9df;
    --muted:#aaa69c;
    --line:rgba(255,255,255,.16);
    --glass:rgba(16,18,17,.62);
  }
  *{box-sizing:border-box}
  html,body{
    width:100%;height:100%;margin:0;overflow:hidden;background:#171b1a;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #focusLens{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;
    background:rgba(16,20,18,.035);
    -webkit-backdrop-filter:blur(var(--focus-blur,0px)) saturate(.98);
    backdrop-filter:blur(var(--focus-blur,0px)) saturate(.98);
    -webkit-mask-image:radial-gradient(ellipse var(--focus-rx,42vw) var(--focus-ry,34vh) at var(--focus-x,50%) var(--focus-y,50%), transparent 0%, transparent 62%, rgba(0,0,0,.42) 82%, #000 100%);
    mask-image:radial-gradient(ellipse var(--focus-rx,42vw) var(--focus-ry,34vh) at var(--focus-x,50%) var(--focus-y,50%), transparent 0%, transparent 62%, rgba(0,0,0,.42) 82%, #000 100%);
    transition:opacity .18s ease;
  }
  #hud{position:fixed;inset:0;z-index:2;pointer-events:none;user-select:none}
  #audioGate{
    position:fixed;inset:0;z-index:20;display:none;place-items:center;
    padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
    background:rgba(10,13,12,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)
  }
  #audioGate.is-visible{display:grid}
  .audioGateCard{
    width:min(360px,calc(100vw - 40px));padding:28px 24px;text-align:center;
    border:1px solid rgba(255,255,255,.2);border-radius:18px;
    background:rgba(20,24,22,.92);box-shadow:0 24px 80px rgba(0,0,0,.42)
  }
  #audioGateTitle{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(23px,6vw,34px);letter-spacing:.16em
  }
  #audioGateButton{
    margin-top:22px;border:1px solid rgba(255,255,255,.3);border-radius:999px;
    background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-size:14px;
    letter-spacing:.14em;padding:14px 28px;cursor:pointer;touch-action:manipulation
  }
  #audioGateButton:disabled{opacity:.58;cursor:wait}
  #audioGateNote{margin-top:14px;font-size:11px;line-height:1.6;letter-spacing:.08em;color:#bdb8ae}
  .brand{
    position:absolute;top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));
    letter-spacing:.18em;font-weight:650;font-size:13px;text-shadow:0 1px 12px #000
  }
  .brand small{display:block;margin-top:5px;letter-spacing:.08em;font-size:10px;font-weight:500;color:var(--muted)}
  #shots{
    position:absolute;top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));
    display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);
    border-radius:999px;background:var(--glass);backdrop-filter:blur(10px)
  }
  .shot{width:10px;height:10px;border:1px solid rgba(255,255,255,.5);border-radius:50%;position:relative}
  .shot.hit::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--ink)}
  .shot.miss::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:#bfb9ae;transform:rotate(-45deg)}

  #matoPanel{
    position:absolute;
    top:max(88px,calc(env(safe-area-inset-top) + 70px));
    right:max(20px,env(safe-area-inset-right));
    width:132px;
    padding:10px 10px 9px;
    border:1px solid var(--line);
    border-radius:16px;
    background:var(--glass);
    backdrop-filter:blur(10px);
    text-align:center;
  }
  #matoLabel{
    font-size:9px;
    letter-spacing:.18em;
    color:#c7c2b8;
    margin-bottom:8px;
  }
  #miniMato{
    position:relative;
    width:106px;
    height:106px;
    margin:auto;
    border-radius:50%;
    background:
      radial-gradient(circle at center,
        #efede4 0 8.7%,
        #171816 8.7% 19.5%,
        #efede4 19.5% 30.3%,
        #171816 30.3% 41.0%,
        #efede4 41.0% 50.0%,
        #d8d3c7 50.0% 51.5%,
        transparent 51.5%);
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.22));
  }
  .matoMark{
    position:absolute;
    width:10px;
    height:10px;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .matoMark::before,
  .matoMark::after{
    content:"";
    position:absolute;
    left:4px;
    top:0;
    width:2px;
    height:10px;
    border-radius:2px;
    background:#b43e32;
    box-shadow:0 0 2px rgba(255,255,255,.45);
  }
  .matoMark::before{transform:rotate(45deg)}
  .matoMark::after{transform:rotate(-45deg)}
  #matoCount{
    margin-top:7px;
    font-size:10px;
    color:#c7c2b8;
    letter-spacing:.08em;
  }

  #status{
    position:absolute;top:13%;left:50%;transform:translateX(-50%);text-align:center;
    text-shadow:0 2px 18px rgba(0,0,0,.85);min-width:290px
  }
  #statusMain{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(22px,4vw,42px);
    letter-spacing:.22em;opacity:.95
  }
  #statusSub{margin-top:8px;font-size:11px;letter-spacing:.12em;color:#c9c5bc}
  #drawWrap{
    position:absolute;left:50%;bottom:max(92px,calc(env(safe-area-inset-bottom) + 74px));
    transform:translateX(-50%);width:min(360px,74vw);opacity:0;transition:opacity .2s
  }
  #drawTrack{height:2px;background:rgba(255,255,255,.18);overflow:hidden}
  #drawFill{height:100%;width:0;background:var(--ink);box-shadow:0 0 12px rgba(255,255,255,.45)}
  #drawLabel{text-align:center;font-size:10px;margin-top:8px;letter-spacing:.16em;color:#c7c3b9}
  #hint{
    position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);
    width:min(760px,calc(100vw - 32px));padding:12px 16px;text-align:center;font-size:12px;line-height:1.6;
    color:#d0ccc2;border:1px solid var(--line);border-radius:10px;background:rgba(12,14,13,.48);
    backdrop-filter:blur(8px)
  }
  #result{
    position:absolute;inset:0;display:none;place-items:center;background:rgba(8,10,9,.48);pointer-events:auto;
    backdrop-filter:blur(4px)
  }
  .card{
    width:min(420px,calc(100vw - 36px));padding:30px 26px;text-align:center;border:1px solid rgba(255,255,255,.18);
    border-radius:18px;background:rgba(20,23,21,.88);box-shadow:0 24px 80px rgba(0,0,0,.38)
  }
  .card .kicker{font-size:10px;letter-spacing:.22em;color:#aaa69c}
  #resultTitle{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:42px;letter-spacing:.18em;margin:10px 0 4px}
  #resultScore{font-size:13px;color:#cbc7bd;margin-bottom:22px}
  #restart{
    pointer-events:auto;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--ink);
    font:inherit;font-size:12px;letter-spacing:.14em;padding:12px 24px;border-radius:999px;cursor:pointer
  }
  #restart:hover{background:rgba(255,255,255,.08)}
  #flash{
    position:absolute;inset:0;opacity:0;pointer-events:none;
    background:radial-gradient(circle at 50% 46%,rgba(255,244,209,.16),transparent 24%)
  }
  #vignette{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at center,transparent 47%,rgba(0,0,0,.42) 100%);opacity:.55
  }
  #releaseMark{
    position:absolute;left:50%;top:50%;width:9px;height:9px;border:1px solid rgba(255,255,255,.22);
    border-radius:50%;transform:translate(-50%,-50%) scale(1);opacity:0
  }
  #centerCall{
    position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(38px,7vw,88px);letter-spacing:.16em;
    color:#fff9ed;text-shadow:0 2px 24px rgba(0,0,0,.9),0 0 28px rgba(255,243,212,.25);
    opacity:0;white-space:nowrap
  }
  #centerSub{
    position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);
    font-size:clamp(12px,2vw,18px);letter-spacing:.18em;color:#f2ecdf;
    opacity:0;text-shadow:0 2px 18px rgba(0,0,0,.9);white-space:nowrap
  }
  @media (max-width:700px){
    #hint{font-size:11px}
    .brand small{display:none}
  }
</style>
</head>
<body>
<div id="focusLens" aria-hidden="true"></div>
<audio id="hitAudio" src="./tekichu.mp3" preload="auto"></audio>
<audio id="releaseAudio" src="./hanare.mp3" preload="auto"></audio>
<div id="audioGate" role="dialog" aria-modal="true" aria-labelledby="audioGateTitle">
  <div class="audioGateCard">
    <div id="audioGateTitle">弓道を始める</div>
    <button id="audioGateButton" type="button">タップして開始</button>
    <div id="audioGateNote">iPhone / iPadでは、音声を有効にするため最初に一度だけタップしてください。</div>
  </div>
</div>
<div id="hud">
  <div class="brand">KYUDO <small>近的 28m / 36cm 霞的 — 狙い幅・散り調整版</small></div>
  <div id="shots">
    <span class="shot" id="s0"></span><span class="shot" id="s1"></span>
    <span class="shot" id="s2"></span><span class="shot" id="s3"></span>
  </div>
  <div id="matoPanel">
    <div id="matoLabel">矢 所</div>
    <div id="miniMato"></div>
    <div id="matoCount">0 / 4</div>
  </div>
  <div id="status"><div id="statusMain">一射目</div><div id="statusSub">的を見て、静かに引く</div></div>
  <div id="drawWrap"><div id="drawTrack"><div id="drawFill"></div></div><div id="drawLabel">引分け</div></div>
  <div id="hint">上から下へドラッグして引き切り、そのまま上下左右へ動かして狙います。引き切った位置では上方、さらに下げるほど下方へ飛びます。矢先の向きを見て離してください。</div>
  <div id="flash"></div><div id="vignette"></div><div id="releaseMark"></div>
  <div id="centerCall"></div><div id="centerSub"></div>
  <div id="result"><div class="card">
    <div class="kicker">四射終了</div>
    <div id="resultTitle">射了</div>
    <div id="resultScore"></div>
    <button id="restart">もう一度射る</button>
  </div></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9aa58f);
scene.fog = new THREE.Fog(0x9aa58f, 20, 48);

const camera = new THREE.PerspectiveCamera(47, innerWidth/innerHeight, 0.05, 80);
const CAMERA_BASE = new THREE.Vector3(0.02, 1.58, 3.7);
camera.position.copy(CAMERA_BASE);
camera.lookAt(0, 1.56, -28);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.prepend(renderer.domElement);

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xe8eee5, 0x3c433c, 1.75));
const sun = new THREE.DirectionalLight(0xfff3da, 2.15);
sun.position.set(-5, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-12; sun.shadow.camera.right=12; sun.shadow.camera.top=12; sun.shadow.camera.bottom=-12;
scene.add(sun);

// ---------- Materials ----------
const matWood = new THREE.MeshStandardMaterial({color:0x5d4430, roughness:.82});
const matDarkWood = new THREE.MeshStandardMaterial({color:0x35281f, roughness:.88});
const matFloor = new THREE.MeshStandardMaterial({color:0x936342, roughness:.78});
const matGrass = new THREE.MeshStandardMaterial({color:0x71875d, roughness:1});
const matWall = new THREE.MeshStandardMaterial({color:0x34243e, roughness:.96});
const matSoil = new THREE.MeshStandardMaterial({color:0x75604a, roughness:1});
const matBamboo = new THREE.MeshStandardMaterial({color:0xa5a36b, roughness:.86});
const matBambooDark = new THREE.MeshStandardMaterial({color:0x5b5d39, roughness:.92});
const matForest = new THREE.MeshStandardMaterial({color:0x315b37, roughness:1});
const matForestDark = new THREE.MeshStandardMaterial({color:0x4b6c4d, roughness:1});
const matLeafLight = new THREE.MeshStandardMaterial({color:0x86a85c, roughness:1});
const matLeafRed = new THREE.MeshStandardMaterial({color:0x8b4841, roughness:1});
const matArrow = new THREE.MeshStandardMaterial({color:0xc8b48d, roughness:.65});
const matFeather = new THREE.MeshStandardMaterial({color:0xeeeae0, roughness:.9, side:THREE.DoubleSide});
const matSkin = new THREE.MeshStandardMaterial({color:0xc59272, roughness:.86});
const matYugake = new THREE.MeshStandardMaterial({color:0x9b7047, roughness:.92});
const matGi = new THREE.MeshStandardMaterial({color:0xe4e1d8, roughness:.95});
const matGiShadow = new THREE.MeshStandardMaterial({color:0xcac6bb, roughness:.98});

// ---------- Ground / dojo ----------
const grass = new THREE.Mesh(new THREE.PlaneGeometry(32, 55), matGrass);
grass.rotation.x = -Math.PI/2; grass.position.set(0,0,-12); grass.receiveShadow=true; scene.add(grass);

const floor = new THREE.Mesh(new THREE.BoxGeometry(7.8,.12,5.8), matFloor);
floor.position.set(0,.07,2.2); floor.receiveShadow=true; scene.add(floor);

// Warm wooden shooting floor: narrow seams make the foreground read as a
// dojo floor instead of a featureless platform.
const floorSeamMaterial = new THREE.MeshStandardMaterial({color:0x5b3b2a,roughness:.88});
for(let z=-.45; z<5.05; z+=.42){
  const seam = new THREE.Mesh(new THREE.BoxGeometry(7.72,.008,.018), floorSeamMaterial);
  seam.position.set(0,.136,z); scene.add(seam);
}

const back = new THREE.Mesh(new THREE.BoxGeometry(8,3.6,.16), matDarkWood);
back.position.set(0,1.8,5.05); back.receiveShadow=true; scene.add(back);

for(let x=-3.5;x<=3.5;x+=1.75){
  const post=new THREE.Mesh(new THREE.BoxGeometry(.12,3.7,.12),matWood);
  post.position.set(x,1.85,4.9); scene.add(post);
}
const roof = new THREE.Mesh(new THREE.BoxGeometry(8.7,.16,3.2), matDarkWood);
roof.position.set(0,3.65,3.4); roof.rotation.x=.02; scene.add(roof);

const frontBeam = new THREE.Mesh(new THREE.BoxGeometry(8.55,.24,.22), matWood);
frontBeam.position.set(0,3.06,2.12); frontBeam.castShadow=true; scene.add(frontBeam);
for(const x of [-4.12,4.12]){
  const column = new THREE.Mesh(new THREE.BoxGeometry(.18,3.1,.18), matWood);
  column.position.set(x,1.55,2.12); column.castShadow=true; scene.add(column);
}

const lane = new THREE.Mesh(new THREE.PlaneGeometry(4.2,31.5), new THREE.MeshStandardMaterial({color:0x7c856f,roughness:1}));
lane.rotation.x=-Math.PI/2; lane.position.set(0,.012,-12.4); scene.add(lane);

function addBambooFence(x){
  for(let z=-2.0; z>=-26.2; z-=5.2){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.055,.068,.72,8), matBamboo);
    post.position.set(x,.36,z); post.castShadow=true; scene.add(post);
    const joint = new THREE.Mesh(new THREE.CylinderGeometry(.073,.073,.055,8), matBambooDark);
    joint.position.set(x,.49,z); scene.add(joint);
  }
  for(const y of [.18,.43]){
    const rail = new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,24.8,8), matBamboo);
    rail.rotation.x=Math.PI/2; rail.position.set(x,y,-14.1); rail.castShadow=true; scene.add(rail);
  }
}
addBambooFence(-2.72);
addBambooFence(2.72);

const azuchi = new THREE.Mesh(new THREE.BoxGeometry(6.3,.82,1.35), matSoil);
azuchi.position.set(0,.41,-28.62); azuchi.rotation.x=-.04; azuchi.receiveShadow=true; scene.add(azuchi);

const targetWall = new THREE.Mesh(new THREE.BoxGeometry(5.55,1.38,.12), matWall);
targetWall.position.set(0,1.47,-28.76); scene.add(targetWall);

const eave = new THREE.Mesh(new THREE.BoxGeometry(5.95,.20,1.35),matDarkWood);
eave.position.set(0,2.28,-28.70); eave.castShadow=true; scene.add(eave);
for(const x of [-2.72,2.72]){
  const post = new THREE.Mesh(new THREE.BoxGeometry(.12,2.25,.12),matWood);
  post.position.set(x,1.15,-28.70); post.castShadow=true; scene.add(post);
}

// A layered tree line keeps the far end of the dojo open and green like the
// reference garden, while the purple curtain gives the mato a clear backdrop.
const forestBackdrop = new THREE.Mesh(new THREE.BoxGeometry(80,50,.35), matForestDark);
forestBackdrop.position.set(0,10,-31.4); scene.add(forestBackdrop);

function addTree(x,z,scale,leafMaterial){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.11,.17,1.9,7),matDarkWood);
  trunk.position.y=.95; trunk.castShadow=true; g.add(trunk);
  const crown = new THREE.Mesh(new THREE.SphereGeometry(1,9,7),leafMaterial);
  crown.position.set(0,2.05,0); crown.scale.set(1.15,1.05,.82); crown.castShadow=true; g.add(crown);
  const crown2 = new THREE.Mesh(new THREE.SphereGeometry(.72,8,6),leafMaterial);
  crown2.position.set(.45,2.62,.08); crown2.scale.set(1.0,.78,.75); crown2.castShadow=true; g.add(crown2);
  g.position.set(x,0,z); g.scale.setScalar(scale); scene.add(g);
}
addTree(-7.4,-31.1,1.55,matForest);
addTree(-5.2,-32.3,1.05,matLeafLight);
addTree(6.9,-31.5,1.45,matForest);
addTree(5.0,-32.7,1.00,matLeafLight);
addTree(-9.2,-29.8,1.05,matLeafLight);
addTree(9.0,-30.3,1.10,matForest);
addTree(-4.1,-30.1,1.15,matLeafLight);
addTree(4.2,-30.2,1.18,matForest);
addTree(-8.3,-33.0,1.30,matForest);
addTree(8.4,-33.2,1.28,matLeafLight);

function addShrub(x,z,scale,material){
  const g=new THREE.Group();
  for(const p of [[0,.28,0],[-.28,.22,.03],[.25,.23,.02],[0,.46,.04]]){
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(.26,8,6),material);
    leaf.position.set(p[0],p[1],p[2]); leaf.scale.set(1,.82,1); leaf.castShadow=true; g.add(leaf);
  }
  g.position.set(x,0,z); g.scale.setScalar(scale); scene.add(g);
}
addShrub(-3.45,-4.8,1.15,matLeafRed);
addShrub(3.45,-7.0,1.00,matLeafLight);
addShrub(-3.55,-16.0,.82,matLeafLight);
addShrub(3.55,-20.0,.90,matLeafRed);

// ---------- Target ----------
const TARGET_Z = -27.92;
// Keep the mato just above the ground line instead of floating high on the wall.
const TARGET_Y = 0.42;
const TARGET_R = 0.20;

const targetGroup = new THREE.Group();
targetGroup.position.set(0,TARGET_Y,TARGET_Z);

function disc(r, color, z){
  const mat = new THREE.MeshStandardMaterial({color,roughness:.78,emissive:0x000000});
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,.012,64), mat);
  m.rotation.x=Math.PI/2; m.position.z=z;
  targetGroup.add(m);
  return m;
}
const targetDiscs = [
  disc(.21,0xe7e1d2,0),
  disc(.172,0x161615,.008),
  disc(.128,0xf1eee5,.017),
  disc(.082,0x181816,.026),
  disc(.037,0xefede4,.035),
];
const rim = new THREE.Mesh(new THREE.TorusGeometry(.21,.011,10,64),matDarkWood);
rim.position.z=.045; targetGroup.add(rim);
scene.add(targetGroup);

let impactRings = [];
function spawnImpactRing(pos, hit){
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(hit ? .02 : .015, .004, 8, 28),
    new THREE.MeshBasicMaterial({color: hit ? 0xfff2cf : 0x9f9278, transparent:true, opacity:.95})
  );
  ring.position.set(pos.x, pos.y, TARGET_Z + .06);
  ring.rotation.x = Math.PI/2;
  ring.userData = { life:.45, scale:1, hit };
  scene.add(ring);
  impactRings.push(ring);
}

// ---------- Bow ----------
const BOW_HOME = new THREE.Vector3(-.21,1.46,2.38);
const UCHIOKOSHI_GRIP_Y = 2.12;
const UCHIOKOSHI_BOW_Z = 2.62;

function drawPoseEase(d){
  // The arms remain high early, then descend through dai-san / hikiwake.
  return d*d*(3-2*d);
}

function bowPosePosition(d){
  const p=drawPoseEase(d);
  return new THREE.Vector3(
    BOW_HOME.x + p*.025,
    THREE.MathUtils.lerp(UCHIOKOSHI_GRIP_Y, BOW_HOME.y, p),
    THREE.MathUtils.lerp(UCHIOKOSHI_BOW_Z, BOW_HOME.z-.02, p)
  );
}

const bowRoot = new THREE.Group();
bowRoot.position.copy(bowPosePosition(0));
scene.add(bowRoot);

const bowVisual = new THREE.Group();
bowRoot.add(bowVisual);

const grip = new THREE.Mesh(
  new THREE.CylinderGeometry(.032,.032,.19,12),
  new THREE.MeshStandardMaterial({color:0x27231e,roughness:.92})
);
grip.position.set(-.02,0,.005);
grip.rotation.z=.06;
bowVisual.add(grip);

// A yumi is not a symmetric Western bow.  The grip sits well below the
// geometric centre, with a short lower limb and a much longer upper limb.
// These points also give it the gentle, characteristic Japanese yumi profile
// rather than a strongly recurved Western-bow silhouette.
const baseBowPts = [
  new THREE.Vector3(.060,-.82,-.010),  // lower tip
  new THREE.Vector3(.018,-.70,.006),
  new THREE.Vector3(-.038,-.55,.012),
  new THREE.Vector3(-.056,-.36,.006),
  new THREE.Vector3(-.034,-.18,-.004),
  new THREE.Vector3(-.012,-.06,-.006),
  new THREE.Vector3(0.000, 0.00,0.000), // grip
  new THREE.Vector3(.018, .20,-.006),
  new THREE.Vector3(.050, .46,-.012),
  new THREE.Vector3(.071, .75,-.010),
  new THREE.Vector3(.066,1.02,.002),
  new THREE.Vector3(.042,1.27,.014),
  new THREE.Vector3(.008,1.48,.022),
  new THREE.Vector3(-.024,1.64,.020),
  new THREE.Vector3(-.045,1.74,.010)    // upper tip
];

// A flattened rectangular cross section reads much more like a yumi than
// TubeGeometry's round "tree branch" cross section.
const bowMaterial = new THREE.MeshStandardMaterial({
  color:0x75451f,
  roughness:.64,
  metalness:0
});
const bowSegments = [];
const BOW_SEGMENTS = 34;

for(let i=0;i<BOW_SEGMENTS;i++){
  const seg = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), bowMaterial);
  seg.castShadow = true;
  bowVisual.add(seg);
  bowSegments.push(seg);
}

// Thin dark backing line gives the laminated bow a little visual depth.
const bowBackMaterial = new THREE.MeshStandardMaterial({
  color:0x3b2718,
  roughness:.72
});
const bowBackSegments = [];
for(let i=0;i<BOW_SEGMENTS;i++){
  const seg = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), bowBackMaterial);
  seg.castShadow = true;
  bowVisual.add(seg);
  bowBackSegments.push(seg);
}

let stringLine = null;
let currentBowFlex = -1;
let stringAtRest = false;

function composeBowPts(flex){
  return baseBowPts.map((p) => {
    const q = p.clone();

    // Each limb bends toward the archer (+Z), while the grip itself stays stable.
    // Using the physical distance from the grip preserves the yumi's asymmetric
    // upper/lower limb proportions even when flexed.
    const upper = q.y >= 0;
    const limbLen = upper ? 1.74 : .82;
    const limb = THREE.MathUtils.clamp(Math.abs(q.y) / limbLen, 0, 1);
    const bend = Math.sin(limb * Math.PI * .5);

    q.z += flex * bend * (upper ? .245 : .205);

    // A very small lateral change helps the long upper limb keep the elegant
    // yumi silhouette without turning it into a Western recurve.
    q.x += flex * Math.sin(limb*Math.PI) * (upper ? -.010 : .008);

    return q;
  });
}

function segmentWidthAt(t){
  // Wider around the grip/inner limbs, tapering toward both tips.
  const y = THREE.MathUtils.lerp(-.82, 1.74, t);
  const limbLen = y >= 0 ? 1.74 : .82;
  const limb = Math.min(1, Math.abs(y)/limbLen);
  return THREE.MathUtils.lerp(.030, .012, Math.pow(limb,.72));
}

function updateBowGeometry(flex){
  if(Math.abs(flex-currentBowFlex) < .003) return;
  currentBowFlex = flex;

  const curve = new THREE.CatmullRomCurve3(composeBowPts(flex));
  const pts = curve.getPoints(BOW_SEGMENTS);

  for(let i=0;i<BOW_SEGMENTS;i++){
    const a = pts[i], b = pts[i+1];
    const d = b.clone().sub(a);
    const len = d.length();
    const mid = a.clone().add(b).multiplyScalar(.5);
    const t = (i+.5)/BOW_SEGMENTS;
    const w = segmentWidthAt(t);

    const seg = bowSegments[i];
    seg.position.copy(mid);
    seg.scale.set(w, len*1.04, .015);
    seg.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize());

    // Lamination/backing strip, slightly behind the main face.
    const back = bowBackSegments[i];
    back.position.copy(mid);
    back.position.z += .010;
    back.scale.set(w*.42, len*1.045, .005);
    back.quaternion.copy(seg.quaternion);
  }
}

function nockLocal(drawAmount){
  // Desired path of the hand-held nock.
  // It starts almost straight backward, then moves toward the right cheek/ear.
  const side = THREE.MathUtils.smoothstep(drawAmount, .56, .98);
  return new THREE.Vector3(
    0.015 + side * .34,
    0.07 + drawAmount * 0.025,
    0.08 + drawAmount * 1.18
  );
}

function updateString(drawAmount, bowFlex, ax=aimX, ay=aimY){
  if(stringLine){
    bowVisual.remove(stringLine);
    stringLine.geometry.dispose();
    stringLine.material.dispose();
  }
  const pts = composeBowPts(bowFlex);
  const topTip = pts[pts.length - 1];
  const botTip = pts[0];

  // While drawing, the string meets the actual displayed rear end of the
  // arrow. Once the arrow has left, there is no nock to pull the string into a
  // second bend: the relaxed string is a single straight span between the tips.
  const n = stringAtRest
    ? topTip.clone().lerp(botTip, .5)
    : getReadyArrowNockLocal(drawAmount, ax, ay);

  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(topTip.x, topTip.y, topTip.z),
    n,
    new THREE.Vector3(botTip.x, botTip.y, botTip.z)
  ]);
  stringLine = new THREE.Line(
    geo,
    new THREE.LineBasicMaterial({color:0xe7dfcf,transparent:true,opacity:.92})
  );
  bowVisual.add(stringLine);
}

function getNockWorld(drawAmount){
  return bowVisual.localToWorld(nockLocal(drawAmount).clone());
}

// Point where the arrow rides on the left thumb beside the bow.
// The ready arrow is always oriented from the nock through this point,
// so the shaft cannot visually detach from the bow during hikiwake.
function getArrowContactWorld(){
  const p = new THREE.Vector3(
    .052,   // just to the right of the bow/grip
    .070,   // on top of the bow-hand thumb
    -.035   // slightly target-side of the grip
  );
  return bowVisual.localToWorld(p);
}

function getAimPointWorld(ax=aimX, ay=aimY){
  return new THREE.Vector3(ax, TARGET_Y + ay, TARGET_Z);
}

function getBallisticLift(drawAmount, fromPoint){
  const speed = 48 + drawAmount*7;
  const distance = Math.abs(TARGET_Z - fromPoint.z);
  const flightTime = distance / speed;
  return .5 * 9.81 * flightTime * flightTime;
}

function getReadyArrowPose(drawAmount, ax=aimX, ay=aimY){
  const desiredNock = getNockWorld(drawAmount);
  const contact = getArrowContactWorld();

  // Preview the same launch direction used by the actual shot.  Including the
  // gravity compensation here makes the visible arrowhead agree with release.
  const ballisticLift = getBallisticLift(drawAmount, contact);
  const visualAimPoint = getAimPointWorld(
    ax * AIM_VISUAL_GAIN_X,
    ay * AIM_VISUAL_GAIN_Y + ballisticLift
  );

  // The shaft should visibly point toward the mato while still resting on
  // the left-thumb contact point beside the bow.
  const dir = visualAimPoint.clone().sub(contact).normalize();

  // At deep hikiwake / kai, the nock and feathers must move behind the
  // shooter's eyes so they leave the forward field of view.
  const minRearDistance = THREE.MathUtils.lerp(.68, 1.78, drawAmount);
  const rearDistance = Math.max(desiredNock.distanceTo(contact), minRearDistance);

  const nock = contact.clone().addScaledVector(dir, -rearDistance);
  return { nock, contact, aimPoint: visualAimPoint, dir, rearDistance };
}

function getReadyArrowNockLocal(drawAmount, ax=aimX, ay=aimY){
  const pose = getReadyArrowPose(drawAmount, ax, ay);
  return bowVisual.worldToLocal(pose.nock.clone());
}

// ---------- First-person arms ----------
const shooter = new THREE.Group();
scene.add(shooter);

function makeSegment(material){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,12),material);
  mesh.castShadow=true;
  shooter.add(mesh);
  return mesh;
}
function placeSegment(mesh,a,b,rA=.07,rB=rA){
  const d=b.clone().sub(a);
  const len=d.length();
  const mid=a.clone().add(b).multiplyScalar(.5);
  mesh.position.copy(mid);
  mesh.scale.set((rA+rB)*.5,len,(rA+rB)*.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
}
function makeFingerSegment(material, radius, length){
  const m = new THREE.Mesh(
    new THREE.CapsuleGeometry(radius, length, 6, 12),
    material
  );
  m.castShadow=true;
  return m;
}

function makeHandSegment(material, a, b, radius){
  const d=b.clone().sub(a);
  const m=new THREE.Mesh(
    new THREE.CapsuleGeometry(radius,Math.max(.004,d.length()-radius*2),6,12),
    material
  );
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  m.castShadow=true;
  return m;
}

function createBowHand(material){
  const g=new THREE.Group();

  // A flattened capsule forms the back of the left hand. From the archer's
  // viewpoint this reads as a compact fist instead of a round skin-coloured
  // ball sitting on the end of the sleeve.
  const backOfHand=new THREE.Mesh(
    new THREE.CapsuleGeometry(.052,.070,8,18),
    material
  );
  backOfHand.rotation.x=Math.PI/2;
  backOfHand.scale.set(1.02,1,.58);
  backOfHand.position.set(.002,.002,-.012);
  backOfHand.castShadow=true;
  g.add(backOfHand);

  // Taper the skin into the sleeve so the wrist and fist remain one form.
  const wrist=new THREE.Mesh(new THREE.CapsuleGeometry(.040,.040,6,14),material);
  wrist.rotation.x=Math.PI/2;
  wrist.scale.set(.96,1,.62);
  wrist.position.set(-.002,0,.072);
  wrist.castShadow=true;
  g.add(wrist);

  // Exactly four seamless finger shapes wrap around the right side of the bow:
  // index, middle, ring and little finger. A single capsule per digit prevents
  // phalanges from being mistaken for extra fingers.
  const fingerNames=['index','middle','ring','little'];
  const fingerYs=[.030,.010,-.012,-.033];
  const fingerReach=[1.00,1.04,1.00,.88];
  for(let i=0;i<4;i++){
    const y=fingerYs[i];
    const reach=fingerReach[i];
    const a=new THREE.Vector3(.014,y,-.060+i*.004);
    const d=new THREE.Vector3(.056*reach,y-.009,-.018+i*.004);
    const finger=makeHandSegment(material,a,d,.0116-i*.0005);
    finger.name=`left-${fingerNames[i]}-finger`;
    g.add(finger);
  }

  // The fifth and final digit is one continuous thumb above the four fingers.
  const thumbA=new THREE.Vector3(.014,.034,-.008);
  const thumbC=new THREE.Vector3(.061,.028,-.086);
  const thumb=makeHandSegment(material,thumbA,thumbC,.0132);
  thumb.name='left-thumb';
  g.add(thumb);

  return g;
}

function createHand(material, right=false){
  const g = new THREE.Group();

  // Palm / back of hand: overlapping rounded volumes give a much more
  // anatomical silhouette than one sphere.
  const palm = new THREE.Mesh(new THREE.SphereGeometry(.073,24,18),material);
  palm.scale.set(.92,.66,1.12);
  palm.position.set(0,0,0);
  palm.castShadow=true;
  g.add(palm);

  const thenar = new THREE.Mesh(new THREE.SphereGeometry(.040,18,14),material);
  thenar.scale.set(.95,.75,1.10);
  // The bow hand is the left hand: its thumb pad belongs on screen-right.
  thenar.position.set(.045,-.010,.018);
  thenar.castShadow=true;
  g.add(thenar);

  // Wrist transition.
  const wrist = new THREE.Mesh(new THREE.CapsuleGeometry(.044,.045,6,12),material);
  wrist.rotation.x=Math.PI/2;
  wrist.position.z=.072;
  wrist.castShadow=true;
  g.add(wrist);

  // Knuckles and 3 phalanges for each finger.
  const fingerXs=[-.043,-.015,.015,.044];
  const fingerLens=[.041,.047,.045,.038];
  for(let i=0;i<4;i++){
    const x=fingerXs[i];

    const knuckle = new THREE.Mesh(new THREE.SphereGeometry(.017,14,10),material);
    knuckle.scale.set(1,.88,1);
    knuckle.position.set(x,.004,-.050);
    knuckle.castShadow=true;
    g.add(knuckle);

    let parent=g;
    let z=-.067;
    let y=-.008;
    for(let j=0;j<3;j++){
      const len=fingerLens[i]*(j===0?1:(j===1?.82:.65));
      const seg=makeFingerSegment(material,.0105-j*.0014,len);
      seg.rotation.x=Math.PI/2 + (right ? -.08 : .13) + j*(right?.09:.18);
      seg.rotation.z=(i-1.5)*.025;
      seg.position.set(x,y,z);
      parent.add(seg);
      z -= len*.62;
      y -= right ? .004 : .010;
    }
  }

  // Thumb: two articulated pieces, extended along the bow/arrow side.
  const thumbBase=makeFingerSegment(material,.014,.050);
  thumbBase.rotation.z=-.92;
  thumbBase.rotation.x=.20;
  thumbBase.position.set(.054,-.005,.000);
  g.add(thumbBase);

  const thumbTip=makeFingerSegment(material,.011,.040);
  thumbTip.rotation.z=-.72;
  thumbTip.rotation.x=.38;
  thumbTip.position.set(.083,-.018,-.020);
  g.add(thumbTip);

  // A subtle nail is visible mainly on the left bow hand.
  if(!right){
    const nailMat=new THREE.MeshStandardMaterial({
      color:0xd7a995,roughness:.55,metalness:0
    });
    const nail=new THREE.Mesh(new THREE.SphereGeometry(.010,14,8),nailMat);
    nail.scale.set(.72,.32,1.08);
    nail.position.set(.095,-.012,-.035);
    nail.castShadow=true;
    g.add(nail);
  }

  return g;
}

const leftUpperSleeve = makeSegment(matGiShadow);
const leftForeSleeve = makeSegment(matGi);
const rightUpperSleeve = makeSegment(matGiShadow);
const rightForeSleeve = makeSegment(matGi);

const leftHand = createBowHand(matSkin);
const rightHand = createHand(matYugake,true);
shooter.add(leftHand,rightHand);

const leftShoulder = new THREE.Vector3(-.26,.48,3.62);
const leftElbow = new THREE.Vector3(-.46,.70,3.12);
const rightShoulder = new THREE.Vector3(.53,.62,3.66);
const rightElbowBase = new THREE.Vector3(.74,1.00,3.61);

function updateShooterPose(poseDraw, rightFollow, handReturn){
  const leftWrist = bowRoot.position.clone().add(new THREE.Vector3(-.005,.015,.055));

  const armPoseDraw = releaseHandBase ? (1-handReturn) : poseDraw;
  const p=drawPoseEase(armPoseDraw);
  const leftShoulderPose=leftShoulder.clone().add(new THREE.Vector3(0,.06*(1-p),0));
  const leftElbowPose=leftElbow.clone().lerp(
    new THREE.Vector3(-.31,1.66,2.92),
    1-p
  );
  const leftForearmDir=leftWrist.clone().sub(leftElbowPose).normalize();
  leftHand.position.copy(leftWrist).addScaledVector(leftForearmDir,.052);
  leftHand.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,0,-1),
    leftForearmDir
  );
  leftHand.rotateZ(-.08);
  placeSegment(leftUpperSleeve,leftShoulderPose,leftElbowPose,.105);
  placeSegment(leftForeSleeve,leftElbowPose,leftWrist,.078);

  // Before release the hand follows the nock normally.
  // After release it is anchored at the FULL-DRAW position; the string may
  // snap forward, but the hand must not follow it.  This is the key zanshin fix.
  let handBase;
  if(releaseHandBase){
    const restNock = getReadyArrowPose(0, aimX, aimY).nock;
    handBase = releaseHandBase.clone().lerp(restNock, handReturn);
  }else{
    handBase = getReadyArrowPose(armPoseDraw, aimX, aimY).nock;
  }

  // The nock and the right hand are the same physical action:
  // the hand holds the nock, so the rear end of the arrow must follow the hand.
  const kai = THREE.MathUtils.smoothstep(armPoseDraw, .58, .98);

  // Only after release does the hand separate from the nock and continue
  // farther right/back into zanshin.
  const releaseOffset = new THREE.Vector3(
    .34*rightFollow,
    .045*rightFollow,
    .11*rightFollow
  );

  const rightWrist = handBase.clone()
    .add(new THREE.Vector3(.045,.016,.025))
    .add(releaseOffset);

  const rightShoulderPose=rightShoulder.clone().add(new THREE.Vector3(0,.07*(1-p),0));
  const uchiRightElbow=new THREE.Vector3(.34,1.78,3.02);
  const elbowBase=rightElbowBase.clone().lerp(uchiRightElbow,1-p);

  // The elbow opens to the right as the nock approaches the cheek/ear.
  elbowBase.x += .20*kai;
  elbowBase.z += .055*kai;

  const elbow = elbowBase.add(new THREE.Vector3(
    .16*rightFollow,
    .03*rightFollow,
    .08*rightFollow
  ));

  rightHand.position.copy(rightWrist);
  rightHand.rotation.set(-.04,-.18-.38*(kai+rightFollow),.18+.12*rightFollow);
  placeSegment(rightUpperSleeve,rightShoulderPose,elbow,.11);
  placeSegment(rightForeSleeve,elbow,rightWrist,.083);

  // The wrist is extremely close to the virtual eye at full draw.  Realistically
  // it is behind the right edge of the shooter's visual field.  Fade the hand
  // geometry out only at the very end of the draw to avoid a near-camera mesh
  // popping across the screen due to perspective clipping.
  const kaiHidden = armPoseDraw >= .93;
  const zanshinHidden = releaseHandBase !== null && handReturn < .80;

  // In a shooter's forward field of view, the right wrist/forearm are already
  // beside/behind the head at kai.  Do not let near-camera perspective make
  // them appear in front of the face.
  rightHand.visible = !(kaiHidden || zanshinHidden);
  rightForeSleeve.visible = !(kaiHidden || zanshinHidden);

  // Hide the upper sleeve only at the very deepest kai / early zanshin;
  // otherwise a small shoulder presence remains natural.
  rightUpperSleeve.visible = !(
    armPoseDraw >= .985 ||
    (releaseHandBase !== null && handReturn < .58)
  );
}

// ---------- Arrow ----------
const ARROW_LEN = 1.72;
const TIP_EXTRA = .035;

function createArrow(){
  // Arrow origin is the nock. This removes the confusing "stuck" arrow feeling while drawing.
  const g = new THREE.Group();
  // Explicit lifecycle flags prevent a fired/spent arrow from ever being treated as the next ready arrow.
  g.userData.isArrow = true;
  g.userData.isReady = true;

  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,ARROW_LEN,8), matArrow);
  shaft.rotation.x = Math.PI/2;
  shaft.position.z = -ARROW_LEN * 0.5;
  g.add(shaft);

  const tip = new THREE.Mesh(
    new THREE.ConeGeometry(.017,.07,10),
    new THREE.MeshStandardMaterial({color:0x43443f,roughness:.38,metalness:.65})
  );
  tip.rotation.x = -Math.PI/2;
  tip.position.z = -ARROW_LEN - TIP_EXTRA;
  g.add(tip);

  // Kyudo arrow feathers: three distinct feather-shaped vanes close to the nock.
  // Use a tapered asymmetric silhouette rather than rectangular cards.
  const featherShape = new THREE.Shape();
  featherShape.moveTo(0.000, 0.000);
  featherShape.bezierCurveTo(.010, .018, .020, .055, .018, .105);
  featherShape.bezierCurveTo(.016, .145, .010, .175, .004, .198);
  featherShape.lineTo(-.004, .198);
  featherShape.bezierCurveTo(-.008, .155, -.010, .095, -.006, .045);
  featherShape.bezierCurveTo(-.004, .020, -.002, .006, 0.000, 0.000);

  const featherGeo = new THREE.ShapeGeometry(featherShape, 10);
  featherGeo.translate(0, -.012, 0);

  const featherMat = new THREE.MeshStandardMaterial({
    color:0xf1eee4,
    roughness:.92,
    side:THREE.DoubleSide
  });

  // Local arrow axis is -Z. Put three feathers at 120 degrees around the shaft.
  const featherZ = -.19;
  for(const rot of [0, Math.PI*2/3, Math.PI*4/3]){
    const holder = new THREE.Group();
    holder.position.z = featherZ;
    holder.rotation.z = rot;

    const f = new THREE.Mesh(featherGeo, featherMat);
    // ShapeGeometry lies in XY. Rotate so feather length follows arrow axis.
    f.rotation.x = Math.PI/2;
    f.position.x = .010;
    holder.add(f);

    g.add(holder);
  }

  // Small dark nock so the rear end is visually readable.
  const nock = new THREE.Mesh(
    new THREE.CylinderGeometry(.0065,.0065,.026,10),
    new THREE.MeshStandardMaterial({color:0x5a4634,roughness:.80})
  );
  nock.rotation.x = Math.PI/2;
  nock.position.z = .010;
  g.add(nock);

  return g;
}

function arrowForward(arrow){
  return new THREE.Vector3(0,0,-1).applyQuaternion(arrow.quaternion).normalize();
}
function arrowTipPos(arrow){
  return arrow.position.clone().addScaledVector(arrowForward(arrow), ARROW_LEN + TIP_EXTRA);
}

function addMiniMatoMark(dx,dy){
  // dx/dy are metres relative to the real target centre.
  // The miniature target radius maps to 50% of this square.
  const nx = THREE.MathUtils.clamp(dx / TARGET_R, -1, 1);
  const ny = THREE.MathUtils.clamp(dy / TARGET_R, -1, 1);

  const mark=document.createElement('span');
  mark.className='matoMark';
  mark.style.left=(50 + nx*48) + '%';
  // Screen Y increases downward, target Y increases upward.
  mark.style.top=(50 - ny*48) + '%';
  elMiniMato.appendChild(mark);

  const count=elMiniMato.querySelectorAll('.matoMark').length;
  elMatoCount.textContent=`${count} / 4`;
}

let hitBuffer=null, releaseBuffer=null;
let audioBufferLoadPromise=null;
const hitAudio = document.querySelector('#hitAudio');
hitAudio.volume = .92;
const releaseAudio = document.querySelector('#releaseAudio');
releaseAudio.volume = .5;
const audioGate = document.querySelector('#audioGate');
const audioGateButton = document.querySelector('#audioGateButton');
const isAppleTouchDevice = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1) ||
  new URLSearchParams(location.search).has('audio-gate-test');
const audioDataPromises = {
  hit: fetch('./tekichu.mp3').then(r=>r.ok ? r.arrayBuffer() : null).catch(()=>null),
  release: fetch('./hanare.mp3').then(r=>r.ok ? r.arrayBuffer() : null).catch(()=>null)
};
function preloadAudioBuffers(){
  if(audioBufferLoadPromise) return audioBufferLoadPromise;
  audioBufferLoadPromise = Promise.all([audioDataPromises.hit,audioDataPromises.release])
    .then(async ([hitData,releaseData])=>{
      const decode = data => data ? audioCtx.decodeAudioData(data.slice(0)) : null;
      [hitBuffer,releaseBuffer] = await Promise.all([decode(hitData),decode(releaseData)]);
    })
    .catch(()=>{ hitBuffer=null; releaseBuffer=null; });
  return audioBufferLoadPromise;
}
function unlockAudioForGesture(){
  const resumePromise=ensureAudio();

  // WebKit only unlocks its audio session from an explicit user gesture.
  // Starting a one-frame, effectively silent buffer in that same event makes
  // the first real sound eligible without playing either game effect early.
  const unlockBuffer=audioCtx.createBuffer(1,1,audioCtx.sampleRate);
  unlockBuffer.getChannelData(0)[0]=.00001;
  const unlockSource=audioCtx.createBufferSource();
  unlockSource.buffer=unlockBuffer;
  unlockSource.connect(audioCtx.destination);
  unlockSource.start(audioCtx.currentTime);

  return Promise.all([resumePromise,preloadAudioBuffers()]).then(()=>{
    const clockStart=audioCtx.currentTime;
    return new Promise(resolve=>setTimeout(()=>{
      const clockRunning=audioCtx.currentTime>clockStart+.005;
      resolve(audioCtx.state==='running' && clockRunning && !!hitBuffer && !!releaseBuffer);
    },140));
  });
}
function playBufferedSound(buffer, fallback, gain){
  ensureAudio();
  if(buffer && audioCtx.state!=='closed'){
    const source=audioCtx.createBufferSource();
    const gainNode=audioCtx.createGain();
    gainNode.gain.value=gain;
    source.buffer=buffer;
    source.connect(gainNode).connect(audioCtx.destination);
    source.start(audioCtx.currentTime);
    return;
  }
  fallback.muted = false;
  fallback.currentTime = 0;
  const playPromise = fallback.play();
  if(playPromise?.catch) playPromise.catch(()=>{});
}
function playHitSound(){
  playBufferedSound(hitBuffer, hitAudio, .92);
}
function playReleaseSound(){
  playBufferedSound(releaseBuffer, releaseAudio, .5);
}
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const resumePromise = audioCtx.state==='running'
    ? Promise.resolve()
    : audioCtx.resume().catch(()=>{});
  preloadAudioBuffers();
  return resumePromise;
}

if(isAppleTouchDevice) audioGate.classList.add('is-visible');
audioGateButton.addEventListener('click', async ()=>{
  audioGateButton.disabled=true;
  audioGateButton.textContent='音声を準備しています…';
  const ready=await unlockAudioForGesture();
  if(ready){
    audioGate.classList.remove('is-visible');
    audioGateButton.textContent='タップして開始';
  }else{
    audioGateButton.disabled=false;
    audioGateButton.textContent='もう一度タップ';
  }
});
function burstNoise(duration=.08, gain=.14, filterFreq=900){
  ensureAudio();
  const n=Math.floor(audioCtx.sampleRate*duration);
  const buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const filter=audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value=filterFreq; filter.Q.value=.8;
  const gn=audioCtx.createGain(); gn.gain.value=gain;
  src.connect(filter).connect(gn).connect(audioCtx.destination); src.start();
}
function twang(){
  ensureAudio();
  burstNoise(.042,.19,1750);
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(155,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(76,audioCtx.currentTime+.13);
  g.gain.setValueAtTime(.14,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.16);
  setTimeout(()=>burstNoise(.065,.055,760),38);
}
function yugaeriWhoosh(){ burstNoise(.085,.045,540); }
function thunk(hit){
  if(hit){
    playHitSound();
    return;
  }
  ensureAudio(); burstNoise(.08,.08,280);
}

// ---------- State ----------
let pointerDown=false, startY=0, startX=0, lastX=0, lastY=0, lastMoveT=0;
let fullDrawReached=false, fullDrawX=0, fullDrawY=0, drawStartedAt=0;
let draw=0, poseDraw=0, holdStable=0, shotCount=0, hitCount=0;
let aimX=0, aimY=0, lockedAimX=0, lockedAimY=0;
let canShoot=true, impacts=[], resultDistances=[];
let postShotHold=false;
let flying=[], particles=[];
let yugaeri=0, rightFollow=0, handReturn=0, releaseKick=0, targetPulse=0;
let releaseHandBase=null;
let releaseAnim={active:false,t:0,drawAtRelease:0};
let poseRecover={active:false,t:0,startYugaeri:0,startRight:0};
let statusToken=0;
let focusStrength=0;
const maxDrag = Math.min(innerHeight*.34, 270);
const pullDir = new THREE.Vector2(0.14, 1).normalize();

// Tuning constants for feel.
// Full draw is a second control phase.  The point where the draw first reaches
// 100% becomes the aiming origin; moving from there maps directly to the
// intended impact offset.  At the untouched origin the shot is deliberately
// high, while pulling farther down passes through centre and then below it.
const FULL_DRAW_UP_AIM = TARGET_R * 2.0;
const AIM_DRAG_RANGE_X = 2.4;
const AIM_DRAG_RANGE_Y = 2.8;
const AIM_VISUAL_GAIN_X = 1.0;
const AIM_VISUAL_GAIN_Y = 1.0;
const AIM_LIMIT_X = 1.10;
const AIM_LIMIT_Y = 1.00;

// Kai timing controls the steadiness feedback shown while aiming.
const KAI_STABLE_START = 0.35;
const KAI_STABLE_FULL = 1.85;


function setAimFromPointer(x,y){
  const nx=(x/innerWidth-.5)*2;
  const ny=(.5-y/innerHeight)*2;

  // Initial click is only a coarse hint.  Keep it near the target so the
  // player fine-tunes placement during hikiwake rather than missing wildly.
  aimX=THREE.MathUtils.clamp(nx*0.085,-.10,.10);
  aimY=THREE.MathUtils.clamp(ny*0.070,-.08,.08);
}

function updateFocusLens(dt){
  // The lens appears only after most of hikiwake is complete.  It follows the
  // same target-plane coordinates as the shot, without adding an aim marker.
  const focusTarget = pointerDown
    ? THREE.MathUtils.smoothstep(draw, .68, .92)
    : 0;
  const easeRate = focusTarget > focusStrength ? 11 : 8;
  focusStrength += (focusTarget-focusStrength) * (1-Math.exp(-dt*easeRate));
  focusStrength = THREE.MathUtils.clamp(focusStrength, 0, 1);

  const focusPoint = getAimPointWorld(lockedAimX, lockedAimY).project(camera);
  const focusX = THREE.MathUtils.clamp((focusPoint.x*.5+.5)*innerWidth, 0, innerWidth);
  const focusY = THREE.MathUtils.clamp((-.5*focusPoint.y+.5)*innerHeight, 0, innerHeight);

  const stable = THREE.MathUtils.smoothstep(holdStable, KAI_STABLE_START, KAI_STABLE_FULL);
  const shortSide = Math.min(innerWidth, innerHeight);
  const focusRx = Math.min(innerWidth*.82, shortSide*(.52 - stable*.10));
  const focusRy = Math.min(innerHeight*.62, shortSide*(.36 - stable*.08));
  const blur = focusStrength * (1.0 + stable*.7);

  elFocusLens.style.setProperty('--focus-x', `${focusX.toFixed(1)}px`);
  elFocusLens.style.setProperty('--focus-y', `${focusY.toFixed(1)}px`);
  elFocusLens.style.setProperty('--focus-rx', `${focusRx.toFixed(1)}px`);
  elFocusLens.style.setProperty('--focus-ry', `${focusRy.toFixed(1)}px`);
  elFocusLens.style.setProperty('--focus-blur', `${blur.toFixed(2)}px`);
  elFocusLens.style.opacity = focusStrength.toFixed(3);
}

function updateReadyArrow(){
  // IMPORTANT:
  // A fired arrow must never be repositioned to the nock again.
  // Previously, after impact it left `flying` but was still referenced by `readyArrow`
  // for ~1 second, so this function pulled it back to the shooter's hand and left a
  // foreground "ghost arrow" when the next arrow was created.
  if(!readyArrow || !readyArrow.userData.isReady) return;

  const pose = getReadyArrowPose(poseDraw, aimX, aimY);

  // Keep the arrow on the bow-hand contact point while making the tip face
  // the target direction instead of drifting left of the mato.
  readyArrow.position.copy(pose.nock);
  readyArrow.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1), pose.dir);
}

function cameraSway(time){
  const inKai = poseDraw > .92 && pointerDown;
  const amp = inKai ? Math.max(.0007, .0037 - holdStable*.00155) : .0027;
  camera.position.x = CAMERA_BASE.x + Math.sin(time*.0017)*amp + releaseKick*.0035;
  camera.position.y = CAMERA_BASE.y + Math.sin(time*.0011+1.4)*amp*.65 - releaseKick*.0015;
  camera.position.z = CAMERA_BASE.z + releaseKick*.006;
  const lookX = aimX*.10;
  const lookY = 1.56 + aimY*.08;
  camera.lookAt(lookX, lookY, -28);
  camera.rotateZ(-releaseKick*.0025);
}

// ---------- Input ----------
renderer.domElement.addEventListener('pointerdown', e=>{
  if(!canShoot || shotCount>=4 || poseRecover.active) return;
  unlockAudioForGesture();
  postShotHold=false;
  pointerDown=true;
  startY=e.clientY; startX=e.clientX; lastX=e.clientX; lastY=e.clientY; lastMoveT=performance.now();
  drawStartedAt=performance.now();
  fullDrawReached=false; fullDrawX=e.clientX; fullDrawY=e.clientY;
  draw=0; poseDraw=0; holdStable=0; yugaeri=0; rightFollow=0; handReturn=0; releaseHandBase=null;
  bowRoot.rotation.set(0,0,0);
  bowRoot.position.copy(bowPosePosition(0));
  aimX=0; aimY=FULL_DRAW_UP_AIM;
  lockedAimX=0; lockedAimY=FULL_DRAW_UP_AIM;
  renderer.domElement.setPointerCapture?.(e.pointerId);
  elDrawWrap.style.opacity=1;
  elStatusMain.textContent='引分け';
  elStatusSub.textContent='まず下へ引き切る';
});

renderer.domElement.addEventListener('pointermove', e=>{
  if(!pointerDown){
    setAimFromPointer(e.clientX,e.clientY);
    return;
  }

  if(!fullDrawReached){
    const dragX = e.clientX - startX;
    const dragY = Math.max(0, e.clientY - startY);

    // Phase 1: only the pull direction controls draw amount.  The first event
    // that reaches full draw becomes the exact neutral point for phase 2.
    const proj = Math.max(0, dragX * pullDir.x + dragY * pullDir.y);
    draw = THREE.MathUtils.clamp(proj / maxDrag, 0, 1);
    poseDraw = draw;

    if(draw>=1){
      fullDrawReached=true;
      fullDrawX=e.clientX;
      fullDrawY=e.clientY;
      lockedAimX=0;
      lockedAimY=FULL_DRAW_UP_AIM;
      lastMoveT=performance.now();
    }
  }else{
    // Phase 2: keep the bow fully drawn and use displacement from the captured
    // full-draw point as an unrestricted two-axis aiming control.
    draw=1;
    poseDraw=1;
    const aimDragX = e.clientX - fullDrawX;
    const aimDragY = e.clientY - fullDrawY;
    lockedAimX = THREE.MathUtils.clamp(
      aimDragX / innerWidth * AIM_DRAG_RANGE_X,
      -AIM_LIMIT_X,
       AIM_LIMIT_X
    );
    lockedAimY = THREE.MathUtils.clamp(
      FULL_DRAW_UP_AIM - aimDragY / innerHeight * AIM_DRAG_RANGE_Y,
      -AIM_LIMIT_Y,
       AIM_LIMIT_Y
    );
  }

  const movement = Math.hypot(e.clientX-lastX,e.clientY-lastY);
  if(movement>2.2) holdStable=Math.max(0,holdStable-.08);
  lastX=e.clientX; lastY=e.clientY; lastMoveT=performance.now();
});

function releaseShot(){
  if(!pointerDown) return;
  pointerDown=false;
  elDrawWrap.style.opacity=0;
  if(draw<.42){
    draw=0; poseDraw=0; holdStable=0;
    updateBowGeometry(0);
    updateString(0,0, aimX, aimY);
    elStatusMain.textContent=ordinal(shotCount);
    elStatusSub.textContent='もう少し大きく引く';
    return;
  }
  fire();
}
renderer.domElement.addEventListener('pointerup', releaseShot);
renderer.domElement.addEventListener('pointercancel', releaseShot);
document.querySelector('#restart').addEventListener('click', resetGame);

// ---------- Shot logic ----------
function easeOutCubic(x){ return 1-Math.pow(1-x,3); }
function easeInOutCubic(x){ return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }

function fire(){
  canShoot=false;
  const arrow=readyArrow;
  if(!arrow) return;
  postShotHold=true;

  // Detach immediately. From this instant onward this object is a fired arrow,
  // never a "ready" arrow. This is the core fix for the accumulated ghost arrows.
  arrow.userData.isReady = false;
  readyArrow = null;

  const releaseDraw=draw;
  stringAtRest=false;
  // Recompute from the final pointer coordinates so a fast last aiming motion
  // cannot release before the next animation frame updates the mesh.
  const releasePose = getReadyArrowPose(releaseDraw, lockedAimX, lockedAimY);
  arrow.position.copy(releasePose.nock);
  arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1), releasePose.dir);

  // Freeze the actual visible nock/right-hand position at full draw.
  // The bow/string returns forward after release, but the hand remains behind.
  releaseHandBase = releasePose.nock.clone();
  handReturn = 0;

  flying.push(arrow);

  const nockStart=arrow.position.clone();
  const startDir=releasePose.dir.clone();
  const tipStart=arrowTipPos(arrow);

  const speed = 48 + releaseDraw*7;

  // The launched arrow starts in the exact direction shown while aiming.
  // Gravity bends the path only after release, so there is no hidden aim
  // compression, magnet, or direction jump at the moment of hanare.
  const vel = startDir.multiplyScalar(speed);

  Object.assign(arrow.userData, {
    isArrow: true,
    isReady: false,
    velocity: vel,
    prevTip: tipStart.clone(),
    prevNock: nockStart.clone(),
    shotIndex: shotCount,
    life: 0,
    vibration: 0,
    flying: true
  });

  shotCount++;
  releaseAnim={active:true,t:0,drawAtRelease:releaseDraw};
  poseRecover.active=false;
  releaseKick=1;
  playReleaseSound();
  twang();
  setTimeout(yugaeriWhoosh,46);

  draw=0;
  holdStable=0;
  elStatusMain.textContent='離れ';
  elStatusSub.textContent='押手を残し、右手は後方へ';
  elReleaseMark.animate([
    {opacity:.9,transform:'translate(-50%,-50%) scale(.65)'},
    {opacity:0,transform:'translate(-50%,-50%) scale(8.5)'}
  ],{duration:360,easing:'ease-out'});

  const token=++statusToken;
  setTimeout(()=>{
    if(token!==statusToken) return;
    if(!canShoot){
      elStatusMain.textContent='残身';
      elStatusSub.textContent='左右に伸びた形を保つ';
    }
  },135);
}

function beginPoseRecovery(){
  poseRecover = {active:true,t:0,startYugaeri:yugaeri,startRight:rightFollow};
  handReturn = 0;
}

function resolveImpact(arrow, hitPos, incomingForward){
  arrow.userData.flying=false;
  arrow.userData.isReady=false;
  arrow.userData.spent=true;
  const idx=flying.indexOf(arrow); if(idx>=0) flying.splice(idx,1);

  const dx=hitPos.x;
  const dy=hitPos.y - TARGET_Y;
  const r=Math.hypot(dx,dy);
  const hit=r<=TARGET_R;

  impacts[arrow.userData.shotIndex]={hit,r,x:dx,y:dy};
  if(hit){ hitCount++; resultDistances.push(r*1000); }

  const tipEmbed = hitPos.clone().addScaledVector(incomingForward, .09);
  const nockFinal = tipEmbed.clone().addScaledVector(incomingForward, -(ARROW_LEN + TIP_EXTRA));
  arrow.position.copy(nockFinal);
  arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1), incomingForward.clone().normalize());
  arrow.userData.vibration = hit ? .55 : .24;
  arrow.userData.baseQuat = arrow.quaternion.clone();

  thunk(hit);
  targetPulse = hit ? 1 : .35;
  statusToken++;

  spawnImpactRing(hitPos, hit);
  elStatusMain.textContent='残身';
  elStatusSub.textContent='左右に伸びた形を保つ';
  if(hit){
    addMiniMatoMark(dx,dy);
    flashCall('的中', `中心から ${Math.round(r*1000)} mm`);
    elFlash.animate([{opacity:.85},{opacity:0}],{duration:430,easing:'ease-out'});
    spawnDust(hitPos,true);
  }else{
    const vertical = dy>.05 ? '上' : dy<-.05 ? '下' : '';
    const horizontal = dx>.05 ? '右' : dx<-.05 ? '左' : '';
    const direction = `${vertical}${horizontal}` || '中央付近';
    flashCall('外れ', `矢所：${direction}`);
    spawnDust(hitPos,false);
  }
  updateHUD(impacts, shotCount, canShoot, pointerDown);

  setTimeout(()=>{
    if(shotCount>=4){
      showResult();
    } else {
      // Hold the released zanshin pose for the full two-second interval.
      // Reset it only as the next shot becomes available so the new arrow
      // starts from a coherent resting bow/hand pose.
      poseRecover.active=false;
      releaseAnim.active=false;
      yugaeri=0;
      rightFollow=0;
      handReturn=0;
      releaseHandBase=null;
      poseDraw=0;
      bowRoot.rotation.set(0,0,0);
      bowRoot.position.copy(bowPosePosition(0));
      updateBowGeometry(0);
      updateString(0,0);
      readyArrow=createArrow();
      readyArrow.userData.isReady=true;
      scene.add(readyArrow);
      stringAtRest=false;
      canShoot=true;
      postShotHold=false;
      updateHUD(impacts, shotCount, canShoot, pointerDown);
    }
  }, 2000);
}

function showResult(){
  canShoot=false;
  const title = hitCount===4 ? '皆中' : hitCount===0 ? '射了' : `${hitCount}中`;
  elResultTitle.textContent = title;
  let score = `四射 ${hitCount}中`;
  if(resultDistances.length){
    const avg=resultDistances.reduce((a,b)=>a+b,0)/resultDistances.length;
    score += `　・　的中矢 平均中心距離 ${Math.round(avg)} mm`;
  }
  elResultScore.textContent = score;
  elResult.style.display='grid';
}

// ---------- Dust ----------
function spawnDust(pos,hit){
  const count=hit?12:8;
  for(let i=0;i<count;i++){
    const p=new THREE.Mesh(
      new THREE.SphereGeometry(.008,5,4),
      new THREE.MeshBasicMaterial({color:hit?0xded6c4:0xa39173,transparent:true,opacity:.55})
    );
    p.position.set(pos.x+(Math.random()-.5)*.08, pos.y+(Math.random()-.5)*.08, TARGET_Z+.12);
    p.userData.v = new THREE.Vector3((Math.random()-.5)*.12, Math.random()*.08, (Math.random()*.12)+.04);
    p.userData.life = .45 + Math.random()*.25;
    scene.add(p);
    particles.push(p);
  }
}

function resetGame(){
  statusToken++;
  // Remove all arrow objects unconditionally. This also guarantees that no orphan
  // foreground arrow can survive a restart.
  for(const obj of scene.children.slice()){
    if(obj.userData?.isArrow || obj.userData?.shotIndex!==undefined || obj===readyArrow) scene.remove(obj);
  }
  for(const p of particles) scene.remove(p);
  for(const r of impactRings) scene.remove(r);
  particles=[]; impactRings=[]; flying=[]; impacts=[]; shotCount=0; hitCount=0; resultDistances=[];
  draw=0; poseDraw=0; holdStable=0; canShoot=true; pointerDown=false; fullDrawReached=false; drawStartedAt=0;
  postShotHold=false;
  yugaeri=0; rightFollow=0; handReturn=0; releaseHandBase=null; releaseKick=0; targetPulse=0;
  rightHand.visible=true;
  rightForeSleeve.visible=true;
  rightUpperSleeve.visible=true;
  releaseAnim={active:false,t:0,drawAtRelease:0};
  stringAtRest=false;
  poseRecover={active:false,t:0,startYugaeri:0,startRight:0};
  bowRoot.position.copy(bowPosePosition(0));
  bowRoot.rotation.set(0,0,0);
  updateBowGeometry(0);
  updateString(0,0);
  readyArrow=createArrow();
  readyArrow.userData.isReady=true;
  scene.add(readyArrow);
  elResult.style.display='none';
  clearMiniMato();
  elStatusMain.textContent='一射目';
  elStatusSub.textContent='的を見て、静かに引く';
  updateHUD(impacts, shotCount, canShoot, pointerDown);
}

// ---------- Main loop ----------
const clock = new THREE.Clock();

function animate(time){
  const dt=Math.min(clock.getDelta(),.028);

  if(pointerDown){
    poseDraw=draw;
    yugaeri=0;
    rightFollow=0;
    handReturn=0;
    releaseHandBase=null;
    bowRoot.rotation.y=0;
    bowRoot.rotation.z=0;
    bowRoot.position.copy(bowPosePosition(draw));

    const drawForFlex = Math.pow(draw, .92);
    updateBowGeometry(drawForFlex);
    updateString(poseDraw, drawForFlex, lockedAimX, lockedAimY);

    if(fullDrawReached){
      if(performance.now()-lastMoveT>85) holdStable=Math.min(2.2,holdStable+dt);
      const kaiReady = performance.now()-drawStartedAt >= 4000;
      elStatusMain.textContent=kaiReady ? '会' : '引分け';
      elStatusSub.textContent='焦点を合わせて、静かに離す';
      elDrawLabel.textContent=
        kaiReady ? '会' : '引分け完了';
    }else{
      elStatusMain.textContent='引分け';
      elStatusSub.textContent=draw>.72?'もう少し下へ引き切る':'下へ引く';
      elDrawLabel.textContent='引分け';
    }
    elDrawFill.style.width=(draw*100).toFixed(1)+'%';
  }

  if(releaseAnim.active){
    releaseAnim.t += dt;
    const snap = easeOutCubic(Math.min(releaseAnim.t/.115,1));
    poseDraw = releaseAnim.drawAtRelease*(1-snap);
    if(releaseAnim.t>.115) stringAtRest=true;

    const turn = easeOutCubic(Math.min(releaseAnim.t/.34,1));
    yugaeri = turn;
    rightFollow = easeOutCubic(Math.min(releaseAnim.t/.22,1));
    handReturn = 0;

    const flexNow = releaseAnim.drawAtRelease*(1-snap);
    updateBowGeometry(flexNow);
    updateString(poseDraw, flexNow, lockedAimX, lockedAimY);

    bowRoot.rotation.y = -2.62 * yugaeri;
    bowRoot.rotation.z = .028*Math.sin(Math.min(releaseAnim.t/.28,1)*Math.PI);
    bowRoot.position.copy(bowPosePosition(1));

    if(releaseAnim.t>.62){
      releaseAnim.active=false;
      poseDraw=0;
      yugaeri=1;
      rightFollow=1;
      bowRoot.rotation.y=-2.62;
      bowRoot.rotation.z=0;
      updateBowGeometry(0);
      updateString(0,0, aimX, aimY);
    }
  }

  if(poseRecover.active){
    poseRecover.t += dt;
    const p=easeInOutCubic(Math.min(poseRecover.t/.62,1));
    yugaeri = THREE.MathUtils.lerp(poseRecover.startYugaeri,0,p);
    rightFollow = THREE.MathUtils.lerp(poseRecover.startRight,0,p);
    handReturn = p;
    bowRoot.rotation.y = -2.62*yugaeri;
    bowRoot.rotation.z = 0;
    bowRoot.position.copy(bowPosePosition(1-p));
    poseDraw=1-p;
    updateBowGeometry(0);
    updateString(0,0, aimX, aimY);
    if(p>=1){
      poseRecover.active=false;
      yugaeri=0;
      rightFollow=0;
      handReturn=0;
      releaseHandBase=null;
      bowRoot.rotation.set(0,0,0);
      bowRoot.position.copy(bowPosePosition(0));
    }
  }

  aimX=pointerDown?lockedAimX:aimX;
  aimY=pointerDown?lockedAimY:aimY;

  updateReadyArrow();
  updateShooterPose(poseDraw, rightFollow, handReturn);

  for(const a of [...flying]){
    if(!a.userData.flying) continue;
    a.userData.life += dt;

    const prevTip = arrowTipPos(a);
    a.userData.prevTip.copy(prevTip);
    a.userData.prevNock.copy(a.position);

    a.userData.velocity.y -= 9.81*dt;
    a.position.addScaledVector(a.userData.velocity, dt);
    a.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,-1), a.userData.velocity.clone().normalize());

    const tip = arrowTipPos(a);

    if(tip.z <= TARGET_Z){
      const p0=a.userData.prevTip, p1=tip;
      const frac=(TARGET_Z-p0.z)/(p1.z-p0.z);
      const hitPos=p0.clone().lerp(p1, THREE.MathUtils.clamp(frac,0,1));
      hitPos.z=TARGET_Z;
      resolveImpact(a, hitPos, a.userData.velocity.clone().normalize());
    }else if(a.userData.life>2.5){
      resolveImpact(a, new THREE.Vector3(tip.x, tip.y, TARGET_Z), a.userData.velocity.clone().normalize());
    }
  }

  for(const obj of scene.children){
    if(obj.userData?.vibration>0 && obj.userData?.baseQuat){
      obj.userData.vibration=Math.max(0,obj.userData.vibration-dt);
      const amp=obj.userData.vibration*.035;
      obj.quaternion.copy(obj.userData.baseQuat);
      obj.rotateY(Math.sin(time*.055)*amp);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.userData.life-=dt;
    p.position.addScaledVector(p.userData.v,dt);
    p.userData.v.y-=.18*dt;
    p.material.opacity=Math.max(0,p.userData.life*.75);
    if(p.userData.life<=0){ scene.remove(p); particles.splice(i,1); }
  }

  for(let i=impactRings.length-1;i>=0;i--){
    const r=impactRings[i];
    r.userData.life-=dt;
    r.userData.scale += dt*(r.userData.hit ? 2.8 : 2.2);
    r.scale.setScalar(r.userData.scale);
    r.material.opacity=Math.max(0,r.userData.life*2);
    if(r.userData.life<=0){ scene.remove(r); impactRings.splice(i,1); }
  }

  targetPulse = Math.max(0, targetPulse - dt*2.8);
  const pulseScale = 1 + targetPulse*.035;
  targetGroup.scale.set(pulseScale,pulseScale,pulseScale);
  for(const d of targetDiscs){
    d.material.emissive.setHex(targetPulse > 0 ? 0x22190c : 0x000000);
    d.material.emissiveIntensity = targetPulse*.65;
  }

  releaseKick=Math.max(0,releaseKick-dt*5.6);
  cameraSway(time);
  updateFocusLens(dt);
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

updateBowGeometry(0);
updateString(0,0);
updateReadyArrow();
bowRoot.position.copy(bowPosePosition(0));
updateShooterPose(0,0,0);
updateHUD(impacts, shotCount, canShoot, pointerDown);
</script>
</body>
</html>
